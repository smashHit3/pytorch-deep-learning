<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Classifier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #333; margin-bottom: 0.5rem; }
        p { color: #666; margin-bottom: 2rem; }

        .config-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .config-panel label {
            font-weight: bold;
            color: #555;
        }
        .config-panel select {
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 200px;
        }

        .upload-section {
            border: 2px dashed #cbd5e0;
            padding: 2rem;
            border-radius: 10px;
            cursor: pointer;
            transition: border-color 0.3s;
            margin-bottom: 1.5rem;
        }
        .upload-section:hover { border-color: #4a90e2; }

        #image-preview {
            max-width: 100%;
            max-height: 300px;
            display: none;
            margin: 1rem auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #357abd; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }

        #result {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
            display: none;
        }
        .prediction-item {
            display: flex;
            justify-content: space-between;
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }
        .top-prediction {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 1rem;
        }
        .confidence-bar {
            height: 8px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .confidence-fill {
            height: 100%;
            background: #4a90e2;
            width: 0%;
            transition: width 0.5s ease-out;
        }
        .loading-spinner {
            display: none;
            margin: 1rem auto;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a90e2;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h1>🐾 AI Classifier</h hizmet>
    <p>Select a model and upload an image to classify</p>

    <div class="config-panel">
        <label for="model-select">Choose Model:</label>
        <select id="model-select">
            {% for model in available_models %}
            <option value="{{ model }}" {% if model == model_name %}selected{% endif %}>{{ model }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="upload-section" onclick="document.getElementById('file-input').click()">
        <span id="upload-text">Click to upload image</span>
        <img id="image-preview" src="#" alt="Preview">
    </div>

    <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="previewImage(this)">

    <button id="predict-btn" class="btn" onclick="uploadImage()" disabled>Classify Image</button>

    <div id="loader" class="loading-spinner"></div>

    <div id="result">
        <div class="top-prediction" id="top-label">...</div>
        <div id="prediction-list"></div>
    </div>
</div>

<script>
    function previewImage(input) {
        const preview = document.getElementById('image-preview');
        const text = document.getElementById('upload-text');
        const btn = document.getElementById('predict-btn');

        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                text.style.display = 'none';
                btn.disabled = false;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    async function uploadImage() {
        const fileInput = document.getElementById('file-input');
        const modelSelect = document.getElementById('model-select');
        const btn = document.getElementById('predict-btn');
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('result');
        const topLabel = document.getElementById('top-label');
        const predList = document.getElementById('prediction-list');

        if (!fileInput.files[0]) return;

        // UI State: Loading
        btn.disabled = true;
        loader.style.display = 'block';
        resultDiv.style.display = 'none';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('model_name', modelSelect.value);

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (data.error) {
                alert('Error: ' + data.error);
            } else {
                // Display Results
                topLabel.innerText = `Prediction: ${data.top_label}`;

                predList.innerHTML = '';
                data.predictions.forEach(pred => {
                    const div = document.createElement('div');
                    div.className = 'prediction-item';
                    div.innerHTML = `
                        <span>${pred.label}</span>
                        <span>${pred.confidence}%</span>
                    `;

                    const barContainer = document.createElement('div');
                    barContainer.className = 'confidence-bar';
                    barContainer.innerHTML = `<div class="confidence-fill" style="width: ${pred.confidence}%"></div>`;

                    predList.appendChild(div);
                    predList.appendChild(barContainer);
                });

                resultDiv.style.display = 'block';
            }
        } catch (e) {
            alert('Network error occurred');
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
