<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Classifier - Home</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .hero {
            text-align: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #1a1a2e;
        }
        .hero p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }
        .cards {
            display: flex;
            gap: 20px;
            margin-top: 2rem;
        }
        .card {
            flex: 1;
            padding: 2rem;
            background: #fafafa;
            border-radius: 12px;
            border: 2px solid #eee;
            text-align: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: #4a90e2;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        .card p {
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>AI Classifier</h1>
            <p>Deep Learning Powered Classification</p>
        </div>

        <div class="cards">
            <a href="/cv" class="card">
                <div class="card-icon">🖼️</div>
                <h2>Image Classification</h2>
                <p>Classify images with CNN models</p>
            </a>
            <a href="/nlp" class="card">
                <div class="card-icon">📝</div>
                <h2>Text Classification</h2>
                <p>Sentiment analysis with NLP models</p>
            </a>
        </div>
    </div>
</body>
</html>
